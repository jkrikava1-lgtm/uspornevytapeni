<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tepelné čerpadlo vzduch-voda – Výkonové údaje</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1117;
    --surface: #161b27;
    --surface2: #1e2535;
    --border: #2a3347;
    --accent: #00c2a8;
    --accent2: #ff6b35;
    --accent3: #6c8eff;
    --text: #e8edf5;
    --muted: #7a8899;
    --cop-low: #ff4d4d;
    --cop-mid: #ffaa00;
    --cop-high: #00c2a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    padding: 16px 16px 24px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .model-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.15em;
    background: rgba(0,194,168,0.1);
    border: 1px solid rgba(0,194,168,0.3);
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 8px;
    display: inline-block;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    font-weight: 300;
    margin-top: 4px;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .ctrl-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-right: 4px;
  }
  .btn-group { display: flex; gap: 4px; }
  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 7px 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.05em;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: rgba(0,194,168,0.15); border-color: var(--accent); color: var(--accent); font-weight: 500; }

  .view-toggle { margin-left: auto; }

  /* Metric cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: #3a4560; }
  .card-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .card-value {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
  }
  .card-value span { font-size: 11px; color: var(--muted); margin-left: 3px; }
  .card-sub { font-size: 10px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.accent-card { border-color: rgba(0,194,168,0.3); background: rgba(0,194,168,0.05); }
  .card.accent-card .card-value { color: var(--accent); }

  /* Table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .table-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .table-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rps-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(0,194,168,0.15);
    color: var(--accent);
    border: 1px solid rgba(0,194,168,0.25);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  thead th {
    padding: 6px 8px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(255,255,255,0.02);
    font-weight: 400;
    border-bottom: 1px solid var(--border);
  }
  thead th.col-ta { text-align: left; padding-left: 20px; }
  thead .group-header {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }

  tbody tr {
    border-bottom: 1px solid rgba(42,51,71,0.6);
    transition: background 0.12s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.025); }

  td {
    padding: 5px 8px;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
  }
  td.col-ta {
    text-align: left;
    padding-left: 12px;
    font-family: 'Sora', sans-serif;
    font-size: 11px;
  }
  td.col-ta .db { font-weight: 600; color: var(--text); }
  td.col-ta .wb { font-size: 11px; color: var(--muted); }

  .kwt { color: #6c8eff; font-weight: 500; }
  .kwe { color: var(--muted); }
  .cop-cell {
    font-weight: 600;
    border-radius: 4px;
    padding: 4px 8px;
    display: inline-block;
    min-width: 36px;
  }

  /* Chart */
  .chart-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-top: 12px;
  }
  canvas { width: 100% !important; }

  .legend {
    display: flex;
    gap: 20px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* View toggle */
  #view-chart { display: none; }
  body.chart-view #view-table { display: none; }
  body.chart-view #view-chart { display: block; }
</style>
</head>
<body>

<!-- Summary cards -->
<div class="cards" id="summary-cards">
  <div class="card">
    <div class="card-label">Max. topný výkon</div>
    <div class="card-value" id="s-kwt-max">—</div>
    <div class="card-sub" id="s-kwt-max-cond">—</div>
  </div>
  <div class="card">
    <div class="card-label">Min. topný výkon</div>
    <div class="card-value" id="s-kwt-min">—</div>
    <div class="card-sub" id="s-kwt-min-cond">—</div>
  </div>
  <div class="card accent-card">
    <div class="card-label">Nejlepší COP</div>
    <div class="card-value" id="s-cop-max">—</div>
    <div class="card-sub" id="s-cop-max-cond">—</div>
  </div>
  <div class="card">
    <div class="card-label">Průměrný COP</div>
    <div class="card-value" id="s-cop-avg">—</div>
    <div class="card-sub">přes všechny podmínky</div>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <span class="ctrl-label">Model</span>
  <div class="btn-group" id="model-btns">
    <button class="btn active" onclick="setModel('BA22I')">BoxAir 22I</button>
    <button class="btn" onclick="setModel('BA30I')">BoxAir 30I</button>
    <button class="btn" onclick="setModel('BA45I')">BoxAir 45I</button>
  </div>
  <span class="ctrl-label">Otáčky</span>
  <div class="btn-group" id="rps-btns">
    <button class="btn active" onclick="setRps(30)">30 otáček/s</button>
    <button class="btn" onclick="setRps(60)">60 otáček/s</button>
    <button class="btn" onclick="setRps(90)">90 otáček/s</button>
    <button class="btn" onclick="setRps('all')">Vše</button>
  </div>
  <div class="btn-group view-toggle">
    <button class="btn active" id="btn-table" onclick="setView('table')">Tabulka</button>
    <button class="btn" id="btn-chart" onclick="setView('chart')">Graf</button>
  </div>
</div>

<!-- Table view -->
<div id="view-table">
  <div class="table-wrap">
    <div class="table-header">
      <span class="table-title">Výkonová tabulka</span>
      <span class="rps-badge" id="rps-badge">30 otáček/s</span>
    </div>
    <div id="table-container"></div>
  </div>
</div>

<!-- Chart view -->
<div id="view-chart">
  <div class="chart-wrap">
    <canvas id="myChart" height="280"></canvas>
    <div class="legend" id="chart-legend"></div>
  </div>
</div>

      { db:-5, wb:-6, tv35:{kwt:12.91,kwe:4.98}, tv45:{kwt:12.57,kwe:5.76}, tv55:{kwt:10.09,kwe:5.69} },
      { db:-10, wb:-11, tv35:{kwt:11.26,kwe:4.73}, tv45:{kwt:11.05,kwe:5.44}, tv55:{kwt:9.66,kwe:5.51} },
      { db:-15, wb:-16, tv35:{kwt:9.69,kwe:4.52}, tv45:{kwt:9.64,kwe:5.16}, tv55:{kwt:8.33,kwe:5.15} },
      { db:-20, wb:-21, tv35:{kwt:8.41,kwe:4.28}, tv45:{kwt:8.51,kwe:4.86}, tv55:{kwt:7.64,kwe:4.89} },
    ],
  },
};

const MODELY = ['BA22I','BA30I','BA45I'];
let currentModel = 'BA22I';

const TV_KEYS = ['tv35','tv45','tv55'];
const TV_LABELS = ['Topná voda 35°C','Topná voda 45°C','Topná voda 55°C'];
const TV_COLORS = ['#6c8eff','#00c2a8','#ff6b35'];

let currentRps = 30;
let currentView = 'table';
let chartInstance = null;

function cop(kwt, kwe) { return (kwt / kwe).toFixed(2); }
function copNum(kwt, kwe) { return kwt / kwe; }

function copColor(c) {
  if (c >= 5) return '#00c2a8';
  if (c >= 3.5) return '#6c8eff';
  if (c >= 2.5) return '#ffaa00';
  return '#ff6b35';
}

function setModel(m) {
  currentModel = m;
  document.querySelectorAll('#model-btns .btn').forEach((b,i) => {
    b.classList.toggle('active', MODELY[i] === m);
  });
  updateBadge();
  updateSummary();
  if (currentView === 'table') renderTable();
  else renderChart();
}

function updateBadge() {
  const otacky = currentRps === 'all' ? 'všechny otáčky' : currentRps + ' otáček/s';
  document.getElementById('rps-badge').textContent = 'BoxAir ' + currentModel.replace('BA','') + ' · ' + otacky;
}

function setRps(rps) {
  currentRps = rps;
  document.querySelectorAll('#rps-btns .btn').forEach((b,i) => {
    b.classList.toggle('active', [30,60,90,'all'][i] === rps);
  });
  updateBadge();
  updateSummary();
  if (currentView === 'table') renderTable();
  else renderChart();
}

function setView(v) {
  currentView = v;
  document.body.classList.toggle('chart-view', v === 'chart');
  document.getElementById('btn-table').classList.toggle('active', v === 'table');
  document.getElementById('btn-chart').classList.toggle('active', v === 'chart');
  if (v === 'chart') renderChart();
  else renderTable();
}

function getAllRows() {
  const rpsKeys = currentRps === 'all' ? [30,60,90] : [currentRps];
  return rpsKeys.flatMap(r => DATA[currentModel][r].map(row => ({...row, rps: r})));
}

function updateSummary() {
  const rows = getAllRows();
  let maxKwt = -Infinity, minKwt = Infinity, maxCop = -Infinity;
  let maxKwtCond = '', minKwtCond = '', maxCopCond = '';
  let sumCop = 0, count = 0;

  rows.forEach(row => {
    TV_KEYS.forEach((tv, ti) => {
      const kwt = row[tv].kwt, kwe = row[tv].kwe;
      const c = copNum(kwt, kwe);
      const cond = `Venkovní teplota ${row.db}°C · ${TV_LABELS[ti]}${currentRps==='all'?' · '+row.rps+' otáček/s':''}`;
      if (kwt > maxKwt) { maxKwt = kwt; maxKwtCond = cond; }
      if (kwt < minKwt) { minKwt = kwt; minKwtCond = cond; }
      if (c > maxCop) { maxCop = c; maxCopCond = cond; }
      sumCop += c; count++;
    });
  });

  document.getElementById('s-kwt-max').innerHTML = `${maxKwt} <span>kW</span>`;
  document.getElementById('s-kwt-max-cond').textContent = maxKwtCond;
  document.getElementById('s-kwt-min').innerHTML = `${minKwt} <span>kW</span>`;
  document.getElementById('s-kwt-min-cond').textContent = minKwtCond;
  document.getElementById('s-cop-max').textContent = maxCop.toFixed(2);
  document.getElementById('s-cop-max-cond').textContent = maxCopCond;
  document.getElementById('s-cop-avg').textContent = (sumCop/count).toFixed(2);
}

function renderTable() {
  const container = document.getElementById('table-container');
  const rpsKeys = currentRps === 'all' ? [30,60,90] : [currentRps];

  let html = '';
  rpsKeys.forEach(rps => {
    const rows = DATA[currentModel][rps];
    if (currentRps === 'all') {
      html += `<div style="padding:10px 20px 4px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;border-top:1px solid var(--border);background:rgba(255,255,255,0.015)">${rps} otáček/s</div>`;
    }
    html += `<table><thead>
      <tr>
        <th class="col-ta">Venkovní teplota (°C)</th>
        <th colspan="3" style="color:#6c8eff;border-left:1px solid var(--border)">Topná voda 35°C</th>
        <th colspan="3" style="color:#00c2a8;border-left:1px solid var(--border)">Topná voda 45°C</th>
        <th colspan="3" style="color:#ff6b35;border-left:1px solid var(--border)">Topná voda 55°C</th>
      </tr>
      <tr>
        <th class="col-ta"></th>
        <th style="border-left:1px solid var(--border)">Výkon (kW)</th><th>Příkon (kW)</th><th>COP</th>
        <th style="border-left:1px solid var(--border)">Výkon (kW)</th><th>Příkon (kW)</th><th>COP</th>
        <th style="border-left:1px solid var(--border)">Výkon (kW)</th><th>Příkon (kW)</th><th>COP</th>
      </tr>
    </thead><tbody>`;

    rows.forEach(row => {
      html += `<tr>
        <td class="col-ta"><span class="db">${row.db}°C</span></td>`;
      TV_KEYS.forEach((tv, ti) => {
        const kwt = row[tv].kwt, kwe = row[tv].kwe;
        const c = copNum(kwt, kwe);
        const cc = copColor(c);
        html += `<td style="border-left:1px solid var(--border)" class="kwt">${kwt}</td>
                 <td class="kwe">${kwe}</td>
                 <td><span class="cop-cell" style="color:${cc};background:${cc}22">${(c).toFixed(2)}</span></td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table>`;
  });
  container.innerHTML = html;
}

function renderChart() {
  const ctx = document.getElementById('myChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();

  const rpsKeys = currentRps === 'all' ? [30,60,90] : [currentRps];
  const labels = DATA[currentModel][30].map(r => `${r.db}°C`);
  const datasets = [];

  rpsKeys.forEach(rps => {
    TV_KEYS.forEach((tv, ti) => {
      const color = TV_COLORS[ti];
      const dash = rps === 30 ? [] : rps === 60 ? [6,3] : [2,2];
      const opacity = rps === 30 ? 'ff' : rps === 60 ? 'cc' : '99';
      datasets.push({
        label: `${TV_LABELS[ti]} · ${rps}rps`,
        data: DATA[currentModel][rps].map(r => r[tv].kwt),
        borderColor: color + opacity,
        backgroundColor: color + '18',
        borderWidth: 2,
        borderDash: dash,
        pointRadius: 3,
        tension: 0.3,
        yAxisID: 'y',
      });
    });
  });

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 2.5,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e2535',
          borderColor: '#2a3347',
          borderWidth: 1,
          titleColor: '#e8edf5',
          bodyColor: '#7a8899',
          padding: 12,
        }
      },
      scales: {
        x: {
          grid: { color: '#2a3347' },
          ticks: { color: '#7a8899', font: { family: 'DM Mono', size: 11 } }
        },
        y: {
          min: 0,
          suggestedMax: Math.ceil(Math.max(...Object.values(DATA[currentModel])
            .flat().flatMap(r => TV_KEYS.map(k => r[k].kwt))) / 5) * 5,
          grid: { color: '#2a3347' },
          ticks: { color: '#7a8899', font: { family: 'DM Mono', size: 11 } },
          title: { display: true, text: 'Topný výkon (kW)', color: '#7a8899', font: { size: 11 } }
        }
      }
    }
  });

  // Legend
  const legendEl = document.getElementById('chart-legend');
  legendEl.innerHTML = datasets.map(ds => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${ds.borderColor}"></div>
      ${ds.label}
    </div>`).join('');
}

// Init
updateBadge();
updateSummary();
renderTable();
</script>
</body>
</html>
