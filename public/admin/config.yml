backend:
  name: github
  repo: jkrikava1-lgtm/uspornevytapeni
  branch: main
  base_url: https://uspornevytapeni.vercel.app
  auth_endpoint: api/auth

media_folder: public/images
public_folder: /images

locale: cs

collections:
  # ============================================================
  # NASTAVENÍ WEBU (site.json)
  # ============================================================
  - name: settings
    label: "Nastavení webu"
    files:
      - name: site
        label: "Kontaktní údaje a firma"
        file: src/data/site.json
        format: json
        fields:
          # --- Základní údaje ---
          - { label: "Název firmy", name: name, widget: string }
          - { label: "Telefon (zobrazený, např. +420 777 724 573)", name: phone, widget: string }
          - { label: "Telefon (odkaz, např. tel:+420777724573)", name: phone_href, widget: string }
          - { label: "E-mail", name: email, widget: string }
          - { label: "Adresa — ulice a číslo", name: address_line1, widget: string }
          - { label: "Adresa — PSČ a město", name: address_line2, widget: string }
          - { label: "Rok založení", name: founded, widget: string }
          - { label: "Tagline (krátký popis firmy)", name: tagline, widget: string }

          # --- Přístupnost ---
          - { label: "Aria — rozbalit podstránky", name: aria_expand_sub, widget: string }
          - { label: "Aria — otevřít menu", name: aria_open_menu, widget: string }
          - { label: "Drobečková navigace — Úvod", name: breadcrumb_home, widget: string }

          # --- Patička ---
          - { label: "Patička — popis firmy", name: footer_desc, widget: text }
          - { label: "Patička — vyrobeno v ČR", name: footer_made_in, widget: string }
          - { label: "Patička — copyright", name: footer_copyright, widget: string }
          - { label: "Patička — sloupec 1 nadpis", name: footer_col1_title, widget: string }
          - label: "Patička — sloupec 1 odkazy"
            name: footer_col1_items
            widget: list
            fields:
              - { label: "Text odkazu", name: label, widget: string }
              - { label: "URL", name: href, widget: string }
          - { label: "Patička — sloupec 2 nadpis", name: footer_col2_title, widget: string }
          - label: "Patička — sloupec 2 odkazy"
            name: footer_col2_items
            widget: list
            fields:
              - { label: "Text odkazu", name: label, widget: string }
              - { label: "URL", name: href, widget: string }
          - { label: "Patička — sloupec 3 nadpis", name: footer_col3_title, widget: string }
          - label: "Patička — sloupec 3 odkazy"
            name: footer_col3_items
            widget: list
            fields:
              - { label: "Text odkazu", name: label, widget: string }
              - { label: "URL", name: href, widget: string }

          # --- Navigace ---
          - { label: "Nav — Poptávka", name: nav_poptavka, widget: string }
          - { label: "Nav — Poptávka (mobil)", name: nav_poptavka_mobile, widget: string }
          - { label: "Nav — O nás", name: nav_o_nas, widget: string }
          - { label: "Nav — Kontakty", name: nav_kontakty, widget: string }
          - { label: "Nav — Reference", name: nav_reference, widget: string }
          - { label: "Nav — Dotace", name: nav_dotace, widget: string }
          - { label: "Nav — Návrh řešení", name: nav_navrh, widget: string }
          - label: "Nav — Návrh řešení položky"
            name: nav_navrh_items
            widget: list
            fields:
              - { label: "URL", name: href, widget: string }
              - { label: "Text", name: label, widget: string }
          - { label: "Nav — Tepelná čerpadla", name: nav_tc, widget: string }
          - label: "Nav — Tepelná čerpadla položky"
            name: nav_tc_items
            widget: list
            fields:
              - { label: "URL", name: href, widget: string }
              - { label: "Text", name: label, widget: string }
          - { label: "Nav — Chytré funkce", name: nav_funkce, widget: string }
          - label: "Nav — Chytré funkce položky"
            name: nav_funkce_items
            widget: list
            fields:
              - { label: "URL", name: href, widget: string }
              - { label: "Text", name: label, widget: string }
          - { label: "Nav — Katalog", name: nav_katalog, widget: string }
          - label: "Nav — Katalog položky"
            name: nav_katalog_items
            widget: list
            fields:
              - { label: "URL", name: href, widget: string }
              - { label: "Text", name: label, widget: string }
          - { label: "Nav — Cena", name: nav_cena, widget: string }
          - label: "Nav — Cena položky"
            name: nav_cena_items
            widget: list
            fields:
              - { label: "URL", name: href, widget: string }
              - { label: "Text", name: label, widget: string }
          - label: "Nav — Cena mobilní extra"
            name: nav_cena_mobile_extra
            widget: list
            required: false
            fields:
              - { label: "URL", name: href, widget: string }
              - { label: "Text", name: label, widget: string }

  # ============================================================
  # ÚVODNÍ STRÁNKA (homepage.json)
  # ============================================================
  - name: homepage
    label: "Úvodní stránka"
    files:
      - name: hp
        label: "Úvodní stránka"
        file: src/data/homepage.json
        format: json
        fields:
          # --- SEO ---
          - { label: "SEO — titulek stránky", name: meta_title, widget: string }
          - { label: "SEO — popis stránky", name: meta_description, widget: text }

          # --- Hero sekce ---
          - { label: "Hero — malý text nad nadpisem", name: hero_badge, widget: string }
          - { label: "Hero — nadpis řádek 1", name: hero_h1_line1, widget: string }
          - { label: "Hero — zvýrazněná část nadpisu", name: hero_h1_highlight, widget: string }
          - { label: "Hero — nadpis řádek 3", name: hero_h1_line3, widget: string }
          - { label: "Hero — popis pod nadpisem", name: hero_text, widget: text }
          - { label: "Hero — hlavní CTA tlačítko", name: hero_cta_primary, widget: string }
          - { label: "Hero — vedlejší CTA tlačítko", name: hero_cta_secondary, widget: string }
          - { label: "Hero — badge zkušenosti", name: hero_experience_badge, widget: string }
          - label: "Hero — slideshow obrázky"
            name: hero_slides
            widget: list
            fields:
              - { label: "Obrázek", name: src, widget: image }
              - { label: "Popisek", name: label, widget: string }
              - { label: "Podrobný popis", name: desc, widget: string }

          # --- Statistiky ---
          - { label: "Statistika 1 — číslo", name: stat1_number, widget: string }
          - { label: "Statistika 1 — popis", name: stat1_label, widget: string }
          - { label: "Statistika 2 — číslo", name: stat2_number, widget: string }
          - { label: "Statistika 2 — popis", name: stat2_label, widget: string }
          - { label: "Statistika 3 — číslo", name: stat3_number, widget: string }
          - { label: "Statistika 3 — popis", name: stat3_label, widget: string }

          # --- Karty "Jak vám můžeme pomoci" ---
          - { label: "Karty — nadpis sekce", name: cards_headline, widget: string }
          - { label: "Karty — podnadpis", name: cards_subtitle, widget: string }
          - { label: "Karty — CTA text", name: cards_cta, widget: string }
          - { label: "Karta 1 — název", name: card1_title, widget: string }
          - { label: "Karta 1 — popis", name: card1_desc, widget: text }
          - { label: "Karta 1 — URL", name: card1_href, widget: string }
          - { label: "Karta 1 — obrázek", name: card1_img, widget: image }
          - { label: "Karta 2 — název", name: card2_title, widget: string }
          - { label: "Karta 2 — popis", name: card2_desc, widget: text }
          - { label: "Karta 2 — URL", name: card2_href, widget: string }
          - { label: "Karta 2 — obrázek", name: card2_img, widget: image }
          - { label: "Karta 3 — název", name: card3_title, widget: string }
          - { label: "Karta 3 — popis", name: card3_desc, widget: text }
          - { label: "Karta 3 — URL", name: card3_href, widget: string }
          - { label: "Karta 3 — obrázek", name: card3_img, widget: image }

          # --- Produkty ---
          - { label: "Produkty — štítek sekce", name: products_label, widget: string }
          - { label: "Produkty — nadpis sekce", name: products_headline, widget: string }
          - { label: "Produkty — CTA tlačítko", name: products_cta, widget: string }
          - label: "Produkty — typy čerpadel"
            name: products
            widget: list
            fields:
              - { label: "Název", name: title, widget: string }
              - { label: "Popis", name: desc, widget: text }
              - { label: "Emoji", name: emoji, widget: string }
              - { label: "URL", name: href, widget: string }

          # --- Úspory / graf ---
          - { label: "Úspory — štítek sekce", name: savings_label, widget: string }
          - { label: "Úspory — nadpis", name: savings_headline, widget: string }
          - { label: "Úspory — text", name: savings_text, widget: text }
          - label: "Úspory — výhody"
            name: savings_benefits
            widget: list
            fields:
              - { label: "Název", name: title, widget: string }
              - { label: "Popis", name: desc, widget: text }
          - { label: "Graf — štítek sekce", name: chart_label, widget: string }
          - { label: "Graf — poznámka pod grafem", name: chart_footnote, widget: text }
          - { label: "Graf — zvýrazněné číslo", name: chart_highlight_number, widget: string }
          - { label: "Graf — zvýrazněný text", name: chart_highlight_text, widget: string }
          - label: "Graf — položky"
            name: chart_items
            widget: list
            fields:
              - { label: "Palivo", name: label, widget: string }
              - { label: "Roční náklad (Kč)", name: value, widget: number }
              - { label: "Barva (CSS třída)", name: color, widget: string }

          # --- Proč my ---
          - { label: "Proč my — štítek sekce", name: why_us_label, widget: string }
          - { label: "Proč my — nadpis", name: why_us_headline, widget: string }
          - label: "Proč my — položky"
            name: why_us_items
            widget: list
            fields:
              - { label: "Název", name: title, widget: string }
              - { label: "Popis", name: desc, widget: text }

          # --- Reference / testimonial ---
          - { label: "Testimonial — citace", name: testimonial_text, widget: text }
          - { label: "Testimonial — jméno", name: testimonial_name, widget: string }
          - { label: "Testimonial — lokalita", name: testimonial_location, widget: string }

          # --- Dotace ---
          - { label: "Dotace — štítek", name: dotace_label, widget: string }
          - { label: "Dotace — nadpis", name: dotace_headline, widget: string }
          - { label: "Dotace — text", name: dotace_text, widget: text }
          - { label: "Dotace — CTA tlačítko", name: dotace_cta, widget: string }

          # --- CTA sekce ---
          - { label: "CTA — nadpis", name: cta_headline, widget: string }
          - { label: "CTA — text", name: cta_text, widget: text }
          - { label: "CTA — tlačítko", name: cta_button, widget: string }

  # ============================================================
  # CENA TEPELNÉHO ČERPADLA (cena.json)
  # ============================================================
  - name: cena
    label: "Stránka Cena"
    files:
      - name: cena
        label: "Cena tepelného čerpadla"
        file: src/data/cena.json
        format: json
        fields:
          # --- SEO ---
          - { label: "SEO — titulek", name: meta_title, widget: string }
          - { label: "SEO — popis", name: meta_description, widget: text }

          # --- Hero ---
          - { label: "Hero — nadpis", name: hero_title, widget: string }
          - { label: "Hero — podnadpis", name: hero_subtitle, widget: text }

          # --- Úvod ---
          - { label: "Úvod — nadpis", name: intro_headline, widget: string }
          - { label: "Úvod — text (HTML)", name: intro_text, widget: markdown }
          - { label: "Úvod — zvýrazněný text (HTML)", name: intro_highlight, widget: markdown }

          # --- Ceníky ---
          - { label: "Badge nejoblíbenější", name: highlight_badge, widget: string }

          - { label: "Ceník 1 — typ", name: price1_typ, widget: string }
          - { label: "Ceník 1 — cenový rozsah", name: price1_rozsah, widget: string }
          - { label: "Ceník 1 — poznámka", name: price1_poznamka, widget: string }
          - { label: "Ceník 1 — bod 1", name: price1_body1, widget: string }
          - { label: "Ceník 1 — bod 2", name: price1_body2, widget: string }
          - { label: "Ceník 1 — bod 3", name: price1_body3, widget: string }

          - { label: "Ceník 2 — typ", name: price2_typ, widget: string }
          - { label: "Ceník 2 — cenový rozsah", name: price2_rozsah, widget: string }
          - { label: "Ceník 2 — poznámka", name: price2_poznamka, widget: string }
          - { label: "Ceník 2 — bod 1", name: price2_body1, widget: string }
          - { label: "Ceník 2 — bod 2", name: price2_body2, widget: string }
          - { label: "Ceník 2 — bod 3", name: price2_body3, widget: string }

          - { label: "Ceník 3 — typ", name: price3_typ, widget: string }
          - { label: "Ceník 3 — cenový rozsah", name: price3_rozsah, widget: string }
          - { label: "Ceník 3 — poznámka", name: price3_poznamka, widget: string }
          - { label: "Ceník 3 — bod 1", name: price3_body1, widget: string }
          - { label: "Ceník 3 — bod 2", name: price3_body2, widget: string }
          - { label: "Ceník 3 — bod 3", name: price3_body3, widget: string }

          # --- Faktory ovlivňující cenu ---
          - { label: "Faktory — nadpis", name: factors_headline, widget: string }
          - { label: "Faktor 1 — název", name: factor1_title, widget: string }
          - { label: "Faktor 1 — popis", name: factor1_desc, widget: text }
          - { label: "Faktor 2 — název", name: factor2_title, widget: string }
          - { label: "Faktor 2 — popis", name: factor2_desc, widget: text }
          - { label: "Faktor 3 — název", name: factor3_title, widget: string }
          - { label: "Faktor 3 — popis", name: factor3_desc, widget: text }
          - { label: "Faktor 4 — název", name: factor4_title, widget: string }
          - { label: "Faktor 4 — popis", name: factor4_desc, widget: text }

          # --- Návratnost investice ---
          - { label: "Návratnost — štítek", name: roi_label, widget: string }
          - { label: "Návratnost — nadpis", name: roi_headline, widget: string }
          - { label: "Návratnost — popisek roční úspory", name: roi_annual_savings_label, widget: string }
          - { label: "Návratnost — roční úspora", name: roi_annual_savings, widget: string }
          - { label: "Návratnost — popisek ceny", name: roi_price_label, widget: string }
          - { label: "Návratnost — cena", name: roi_price, widget: string }
          - { label: "Návratnost — popisek dotace", name: roi_dotace_label, widget: string }
          - { label: "Návratnost — dotace", name: roi_dotace, widget: string }
          - { label: "Návratnost — popisek čisté investice", name: roi_net_label, widget: string }
          - { label: "Návratnost — čistá investice", name: roi_net, widget: string }
          - { label: "Návratnost — popisek doby návratnosti", name: roi_payback_label, widget: string }
          - { label: "Návratnost — doba návratnosti", name: roi_payback, widget: string }
          - { label: "Návratnost — poznámka pod čarou", name: roi_footnote, widget: text }

          # --- Užitečné nástroje ---
          - { label: "Nástroje — nadpis", name: tools_headline, widget: string }
          - { label: "Nástroj 1 — název", name: tool1_title, widget: string }
          - { label: "Nástroj 1 — popis", name: tool1_desc, widget: text }
          - { label: "Nástroj 1 — CTA", name: tool1_cta, widget: string }
          - { label: "Nástroj 2 — název", name: tool2_title, widget: string }
          - { label: "Nástroj 2 — popis", name: tool2_desc, widget: text }
          - { label: "Nástroj 2 — CTA", name: tool2_cta, widget: string }

          # --- CTA ---
          - { label: "CTA — nadpis", name: cta_headline, widget: string }
          - { label: "CTA — text", name: cta_text, widget: text }
          - { label: "CTA — tlačítko", name: cta_button, widget: string }

  # ============================================================
  # DOTACE (dotace.json)
  # ============================================================
  - name: dotace
    label: "Stránka Dotace"
    files:
      - name: dotace
        label: "Dotace na tepelná čerpadla"
        file: src/data/dotace.json
        format: json
        fields:
          # --- SEO ---
          - { label: "SEO — titulek", name: meta_title, widget: string }
          - { label: "SEO — popis", name: meta_description, widget: text }

          # --- Hero ---
          - { label: "Hero — nadpis", name: hero_title, widget: string }
          - { label: "Hero — podnadpis", name: hero_subtitle, widget: text }

          # --- Úvod ---
          - { label: "Úvod — text (HTML)", name: intro, widget: markdown }

          # --- Harmonogram ---
          - { label: "Harmonogram — nadpis", name: harmonogram_headline, widget: string }
          - { label: "Harmonogram — úvod", name: harmonogram_intro, widget: text }
          - label: "Harmonogram — termíny"
            name: harmonogram
            widget: list
            fields:
              - { label: "Datum", name: datum, widget: string }
              - { label: "Popis", name: popis, widget: text }

          # --- Změna dotace vs. úvěry ---
          - { label: "Změna — nadpis", name: zmena_headline, widget: string }
          - { label: "Změna — úvod", name: zmena_intro, widget: text }

          # --- Běžné domácnosti ---
          - { label: "Běžné — nadpis", name: bezne_title, widget: string }
          - { label: "Běžné — podnadpis", name: bezne_subtitle, widget: string }
          - { label: "Běžné — popis (HTML)", name: bezne_desc, widget: markdown }
          - { label: "Běžné — jak to funguje (HTML)", name: bezne_jak, widget: markdown }
          - { label: "Běžné — výhoda (HTML)", name: bezne_vyhoda, widget: markdown }
          - { label: "Běžné — nevýhoda (HTML)", name: bezne_nevyhoda, widget: markdown }

          # --- Zranitelné domácnosti ---
          - { label: "Zranitelné — nadpis", name: zranitelne_title, widget: string }
          - { label: "Zranitelné — podnadpis", name: zranitelne_subtitle, widget: string }
          - { label: "Zranitelné — popis (HTML)", name: zranitelne_desc, widget: markdown }
          - label: "Zranitelné — přehled podpory"
            name: zranitelne_body
            widget: list
            fields:
              - { label: "Popisek", name: label, widget: string }
              - { label: "Hodnota", name: value, widget: string }

          # --- Podpora TČ ---
          - { label: "Podpora TČ — nadpis", name: tc_headline, widget: string }
          - { label: "Podpora TČ — úvod", name: tc_intro, widget: text }
          - label: "Podpora TČ — položky"
            name: tc_body
            widget: list
            fields:
              - { label: "Popisek", name: label, widget: string }
              - { label: "Hodnota", name: value, widget: string }
          - { label: "Podpora TČ — poznámka", name: tc_note, widget: text }

          # --- Renovační pas ---
          - { label: "Renovační pas — nadpis", name: renovacni_headline, widget: string }
          - { label: "Renovační pas — úvod", name: renovacni_intro, widget: text }
          - label: "Renovační pas — body (HTML)"
            name: renovacni_body
            widget: list
            field:
              { label: "Text (HTML)", name: text, widget: markdown }

          # --- Tip box ---
          - { label: "Tip — zvýrazněný text", name: tip_box, widget: text }

          # --- CTA ---
          - { label: "CTA — nadpis", name: cta_headline, widget: string }
          - { label: "CTA — text", name: cta_text, widget: text }
          - { label: "CTA — tlačítko", name: cta_button, widget: string }

  # ============================================================
  # REFERENCE (reference.json)
  # ============================================================
  - name: reference
    label: "Stránka Reference"
    files:
      - name: reference
        label: "Reference"
        file: src/data/reference.json
        format: json
        fields:
          # --- SEO ---
          - { label: "SEO — titulek", name: meta_title, widget: string }
          - { label: "SEO — popis", name: meta_description, widget: text }

          # --- Hero ---
          - { label: "Hero — nadpis", name: hero_title, widget: string }
          - { label: "Hero — podnadpis", name: hero_subtitle, widget: text }

          # --- Statistiky ---
          - { label: "Statistika 1 — číslo", name: stat1_num, widget: string }
          - { label: "Statistika 1 — popis", name: stat1_label, widget: string }
          - { label: "Statistika 2 — číslo", name: stat2_num, widget: string }
          - { label: "Statistika 2 — popis", name: stat2_label, widget: string }
          - { label: "Statistika 3 — číslo", name: stat3_num, widget: string }
          - { label: "Statistika 3 — popis", name: stat3_label, widget: string }
          - { label: "Statistika 4 — číslo", name: stat4_num, widget: string }
          - { label: "Statistika 4 — popis", name: stat4_label, widget: string }

          # --- Mapa ---
          - { label: "Mapa — nadpis", name: map_headline, widget: string }
          - { label: "Mapa — podnadpis", name: map_subtitle, widget: string }
          - { label: "Mapa — popisek legendy", name: map_legend_label, widget: string }
          - { label: "Mapa — legenda vzduch", name: map_legend_vzduch, widget: string }
          - { label: "Mapa — legenda země", name: map_legend_zeme, widget: string }
          - { label: "Mapa — legenda voda", name: map_legend_voda, widget: string }
          - { label: "Mapa — stat 1 číslo", name: map_stat1_num, widget: string }
          - { label: "Mapa — stat 1 popis", name: map_stat1_label, widget: string }
          - { label: "Mapa — stat 2 číslo", name: map_stat2_num, widget: string }
          - { label: "Mapa — stat 2 popis", name: map_stat2_label, widget: string }

          # --- Reference / realizace ---
          - label: "Reference — seznam realizací"
            name: references
            widget: list
            fields:
              - { label: "Lokalita", name: lokalita, widget: string }
              - { label: "Typ projektu", name: typ, widget: string }
              - { label: "Model čerpadla", name: system, widget: string }
              - { label: "Rok realizace", name: rok, widget: string }
              - { label: "Hlavní foto", name: image, widget: image }
              - label: "Galerie fotek"
                name: gallery
                widget: list
                field:
                  { label: "Foto", name: photo, widget: image }

          # --- CTA ---
          - { label: "CTA — nadpis", name: cta_headline, widget: string }
          - { label: "CTA — text", name: cta_text, widget: text }
          - { label: "CTA — tlačítko", name: cta_button, widget: string }

  # ============================================================
